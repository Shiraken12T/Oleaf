plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenLocal()
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
	}
	maven {
		name = 'Shedaniel'
		url = 'https://maven.shedaniel.me/'
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven/'
	}
}

loom {
	mods {
		'oleaf' {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	modImplementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: 'net.fabricmc.fabric-api')
	}
}

processResources {
	def ver = project.version
	inputs.property 'version', ver

	filesMatching('fabric.mod.json') {
		expand 'version': ver
	}

	from('../..') {
		include 'LICENSE'
		include 'THIRD_PARTY_NOTICES.txt'
		into 'META-INF'
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from('../../LICENSE') {
		rename { "${it}_oleaf" }
	}
}

tasks.register('packageToJars', Copy) {
	dependsOn remapJar
	from(remapJar.archiveFile) {
		rename { "oleaf-1.20.1-fabric.jar" }
	}
	into rootProject.file('../../jars/1.20.1')
	doFirst {
		def outDir = rootProject.file('../../jars/1.20.1')
		outDir.mkdirs()
	}
}

tasks.named('build').configure {
	finalizedBy('packageToJars')
}
